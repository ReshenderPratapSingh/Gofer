services:
  # 1. Merchant Web Service (Persistent Node process)
  - type: web
    name: gofer-merchant
    runtime: node
    plan: free
    region: oregon
    rootDir: merchant
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: MAX_BUDGET_PAISE
        value: "900000"
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

  # 2. Agent Web Service (Docker runtime with Chromium and Linux dependencies)
  - type: web
    name: gofer-agent
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MERCHANT_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: HEADLESS
        value: "true"
